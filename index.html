<script>
  // 首帧前应用持久化的主题与纸色，避免"先暗后亮"闪变（编辑器 JS 就绪后会接管）
  (function () {
    try {
      var saved = JSON.parse(localStorage.getItem('md-editor-warm-v1') || 'null');
      var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      var theme = (saved && saved.theme) || (light ? 'light' : 'dark');
      document.body.setAttribute('data-theme', theme);
      var paper = (saved && (theme === 'light' ? saved.paperLight : saved.paperDark))
        || (theme === 'light' ? 'parchment' : 'ink');
      document.body.setAttribute('data-paper', paper);
    } catch (e) {}
  })();
</script>

        <span class="font-controls-label">字号</span>
        <button class="tbtn font-btn-sm font-dec" onClick="{{ fontDec }}" title="缩小">A−</button>
        <span ref="{{ fontSizeRef }}" class="font-size-value">16px</span>
        <button class="tbtn font-btn-sm font-inc" onClick="{{ fontInc }}" title="放大">A+</button>
      </span>
      <span ref="{{ countRef }}" class="word-count">0 字 · 0 行</span>
    </span>
  </footer>

  <!-- ===== SELECTION TOOLBAR ===== -->
  <div ref="{{ selBarRef }}" class="selection-toolbar" onMouseDown="{{ noop }}">
    <button class="seltool" onClick="{{ copySel }}" title="复制选中文字">
      <span class="seltool-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2" sc-camel-stroke-linecap="round" sc-camel-stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg></span>复制
    </button>
    <button class="seltool" onClick="{{ copyHtml }}" title="复制为带格式 HTML">
      <span class="seltool-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2" sc-camel-stroke-linecap="round" sc-camel-stroke-linejoin="round"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6"></path></svg></span>复制HTML
    </button>
    <span class="seltool-divider"></span>
    <button class="seltool" onClick="{{ markMarker }}" title="马克笔高亮">
      <span class="seltool-icon"><span class="seltool-glyph glyph-mark">A</span></span>马克笔
    </button>
    <button class="seltool" onClick="{{ markWavy }}" title="波浪线">
      <span class="seltool-icon"><span class="seltool-glyph glyph-wavy">A</span></span>波浪线
    </button>
    <button class="seltool" onClick="{{ markStraight }}" title="直线">
      <span class="seltool-icon"><span class="seltool-glyph glyph-line">A</span></span>直线
    </button>
    <span class="seltool-divider"></span>
    <button class="seltool" onClick="{{ writeIdea }}" title="写想法（加批注）">
      <span class="seltool-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2" sc-camel-stroke-linecap="round" sc-camel-stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><path d="M12 7v6M9 10h6" sc-camel-stroke-width="1.6"></path></svg></span>写想法
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dark&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;tsType&quot;:&quot;'dark'|'light'&quot;},&quot;wrapSource&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const Component = window.createMarkdownEditorComponent(DCLogic, React);
</script>
</body>
</html>
