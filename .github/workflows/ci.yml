name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 单测脚本依赖 node --experimental-strip-types（22.6+ 才有；本地开发为 24）
          node-version: 22
          cache: npm

      - name: Rust toolchain (gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Check code size
        run: node scripts/check-code-size.js

      - name: Check bundle size
        run: node scripts/check-bundle-size.js

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Bootstrap reading font (best-effort)
        # 阅读字体授权限制不入库：CI 尽力从源 CDN 拉取并子集化；失败仅告警，
        # editor.spec 的字体严格断言会自动降级跳过（无字体的裸环境不出网校验仍生效）
        run: |
          npm run font:fetch || echo "::warning::font fetch failed (CDN unreachable)"
          npm run font:subset || echo "::warning::font subset failed"

      - name: Unit tests (frontend)
        run: npm test

      - name: Unit tests (Rust)
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath cargo-test.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::cargo test failed, digest follows"
            Get-Content cargo-test.log |
              Where-Object { $_ -match 'panicked|assertion|FAILED|error\[|failures:|left:|right:|cannot find|linker' } |
              Select-Object -First 10 |
              ForEach-Object { Write-Host ("::error::" + $_.Substring(0, [Math]::Min(300, $_.Length))) }
            exit $LASTEXITCODE
          }

      - name: Build (Vite)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7